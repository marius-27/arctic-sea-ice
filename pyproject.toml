[project]
name = "arctic-sea-ice"
version = "0.1.0"
description = "Reproducible analysis of Arctic sea ice extent and area from Copernicus Marine satellite data, validated against NSIDC."
readme = "README.md"
authors = [
    { name = "MariusMunteanu", email = "mmunteanu54321@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "copernicusmarine>=2.5.2",
    "numpy>=2.5.5",
    "pyyaml>=6.0.4",
    "xarray>=2026.9.0",
]

[project.scripts]
arctic-sea-ice = "arctic_sea_ice:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0",
]

# --- Code quality -----------------------------------------------------------

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports, undefined names
    "I",    # isort: import ordering
    "B",    # flake8-bugbear: likely bugs
    "UP",   # pyupgrade: modern Python syntax
    "SIM",  # flake8-simplify
    "NPY",  # numpy-specific rules (deprecated APIs, legacy random)
    "RUF",  # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# copernicusmarine ships without type information (no py.typed marker).
[[tool.mypy.overrides]]
module = "copernicusmarine"
ignore_missing_imports = true

# --- Testing ----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["arctic_sea_ice"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
